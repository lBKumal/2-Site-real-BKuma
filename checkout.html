<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — MuscleX</title>
<meta name="description" content="Checkout demonstrativo.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="carrinho">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div id="site-header"></div>
<main id="conteudo">
<section class="secao"><div class="container"><h1>Finalizar pedido</h1><p class="aviso-demo"><strong>Checkout de demonstração.</strong> Nenhum pagamento é realizado e nenhum dado é enviado. Não digite dados reais.</p><div class="checkout-grid"><form id="checkout-form" class="form" novalidate><div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" type="text" required></div><div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" required></div><div class="campo"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" required></div><div class="campo"><label for="endereco">Endereço (fictício)</label><input id="endereco" name="endereco" type="text" required></div><div class="campo"><label for="cidade">Cidade e estado</label><input id="cidade" name="cidade" type="text" required></div><div class="campo"><label for="pagamento">Forma de pagamento (demonstrativa)</label><select id="pagamento" name="pagamento" required><option value="">Selecione</option><option value="cartao">Cartão</option><option value="pix">Pix</option><option value="boleto">Boleto</option></select></div><button class="btn btn-primario" type="submit">Concluir pedido de teste</button></form><aside id="checkout-summary"></aside></div></div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/forms.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
